name: Build RhythmForge

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev mesa-common-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build build --config Release --target RhythmForge_VST3 --parallel 2

      - name: Ad-hoc sign (macOS)
        if: runner.os == 'macOS'
        run: codesign --force --deep -s - build/RhythmForge_artefacts/Release/VST3/RhythmForge.vst3

      - uses: actions/upload-artifact@v4
        with:
          name: RhythmForge-${{ runner.os }}-VST3
          path: build/RhythmForge_artefacts/Release/VST3/RhythmForge.vst3

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev mesa-common-dev

      - name: Configure
        run: cmake -S . -B build-test -DCMAKE_BUILD_TYPE=Release -DRHYTHMFORGE_BUILD_TESTS=ON

      - name: Build smoke test
        run: cmake --build build-test --target RhythmForgeSmokeTest --parallel 2

      - name: Run smoke test
        run: ./build-test/RhythmForgeSmokeTest_artefacts/Release/RhythmForgeSmokeTest
